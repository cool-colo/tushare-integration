id: 491
api_name: etf_limit
name: etf_limit
comment: ETF每日涨跌停价格（Tushare doc_id=491）
dependencies:
  - stock/basic/trade_cal
  - fund/basic/etf_basic
primary_key:
  - ts_code
  - trade_date
indexes: []
columns:
  - name: trade_date
    data_type: date
    length: 0
    default: "1970-01-01"
    comment: 交易日期
  - name: ts_code
    data_type: str
    length: 16
    default: ""
    comment: 合约代码
  - name: pre_close
    data_type: float
    length: 0
    default: "0.0"
    comment: 昨日收盘价
  - name: up_limit
    data_type: float
    length: 0
    default: "0.0"
    comment: 涨停价
  - name: down_limit
    data_type: float
    length: 0
    default: "0.0"
    comment: 跌停价
