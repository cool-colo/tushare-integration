id: 121
api_name: fund_portfolio
name: fund_portfolio
comment: 公募基金季度股票持仓（Tushare doc_id=121）
dependencies: []
primary_key:
  - ts_code
  - ann_date
  - end_date
  - symbol
indexes: []
columns:
  - name: ts_code
    data_type: str
    length: 16
    default: ''
    comment: TS基金代码
  - name: ann_date
    data_type: date
    default: '1970-01-01'
    comment: 公告日期
  - name: end_date
    data_type: date
    default: '1970-01-01'
    comment: 持仓报告期截止日期
  - name: symbol
    data_type: str
    length: 16
    default: ''
    comment: 持有的股票代码
  - name: mkv
    data_type: float
    nullable: true
    comment: 持有股票市值（元，保持源值）
  - name: amount
    data_type: float
    nullable: true
    comment: 持有股票数量（股，保持源精度）
  - name: stk_mkv_ratio
    data_type: float
    nullable: true
    comment: 占股票市值比（保持源比例尺度，不换算）
  - name: stk_float_ratio
    data_type: float
    nullable: true
    comment: 占流通股本比例（保持源比例尺度，不换算）
