id: 2032
name: dwd_etf_basic
comment: ETF基础信息标准层
builder: raw_versioned
source_alias: raw
source:
  table_name: etf_basic_raw
  schema_name: fund/basic/etf_basic
instrument_type: fund
business_key:
  - ts_code
# 源表自带 exchange 列（SH/SZ），与 DWD 标准层统一派生的 exchange 列重名，
# 这里排除源列，交由 exchange_expr 从 ts_code 后缀统一派生，避免建表时列冲突。
source_column_excludes:
  - exchange
instrument_id_expr: "concat('fund:', raw.ts_code)"
source_code_expr: raw.ts_code
exchange_expr: "arrayElement(splitByChar('.', assumeNotNull(raw.ts_code)), 2)"
event_date_expr: toDate(raw._ingest_time)
calendar_date_expr: toDate(raw._ingest_time)
available_trade_date_expr: coalesce(calendar_map.next_trade_date, toDate(raw._ingest_time))
partition_key:
  - toYear(available_trade_date)
indexes:
  - name: dwd_etf_basic_idx
    columns:
      - instrument_id
      - ts_code
      - sys_from
