id: 2034
name: dwd_stock_holder_number
comment: 股东户数PIT标准层
builder: raw_versioned
source:
  table_name: stk_holdernumber_raw
  schema_name: stock/market/stk_holdernumber
business_key:
- ts_code
- end_date
- ann_date
instrument_type: stock
instrument_id_expr: concat('stock:', src.ts_code)
source_code_expr: src.ts_code
exchange_expr: arrayElement(splitByChar('.', assumeNotNull(src.ts_code)), 2)
event_date_expr: src.end_date
calendar_date_expr: src.ann_date
available_trade_date_expr: addDays(assumeNotNull(calendar_map.next_trade_date), throwIf(isNull(calendar_map.next_trade_date), 'Missing SSE next trading
  day'))
source_filters:
- src.ann_date >= src.end_date
- src.end_date >= toDate32('2010-01-01')
partition_key:
- toYear(available_trade_date)
indexes:
- name: dwd_stock_holder_number_idx
  columns:
  - instrument_id
  - event_date
  - sys_from
