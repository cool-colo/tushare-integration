id: 2027
name: dwd_stock_share_float
comment: 限售股解禁标准层
builder: raw_versioned
source:
  table_name: share_float_raw
  schema_name: stock/market/share_float
# Tushare can return several tranches for the same holder/date/type. The two
# measure columns are therefore part of row identity, but remain nullable in
# raw history and must not be discarded by the generic business-key filter.
nullable_business_key:
  - float_share
  - float_ratio
instrument_type: stock
instrument_id_expr: "concat('stock:', src.ts_code)"
source_code_expr: src.ts_code
exchange_expr: "arrayElement(splitByChar('.', assumeNotNull(src.ts_code)), 2)"
event_date_expr: src.float_date
calendar_date_expr: src.ann_date
available_trade_date_expr: coalesce(calendar_map.next_trade_date, src.ann_date, src.float_date)
source_filters:
  - "src.ann_date IS NULL OR src.float_date IS NULL OR src.ann_date <= src.float_date"
  - "src.ann_date != toDate('1970-01-01')"
partition_key:
  - toYear(available_trade_date)
indexes:
  - name: dwd_stock_share_float_idx
    columns:
      - instrument_id
      - event_date
      - sys_from
