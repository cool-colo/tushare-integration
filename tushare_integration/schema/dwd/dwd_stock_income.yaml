id: 2006
name: dwd_stock_income
comment: 股票利润表标准层
builder: raw_versioned
source:
  table_name: income_raw
  schema_name: stock/financial/income
instrument_type: stock
instrument_id_expr: "concat('stock:', src.ts_code)"
source_code_expr: src.ts_code
exchange_expr: "arrayElement(splitByChar('.', assumeNotNull(src.ts_code)), 2)"
event_date_expr: src.end_date
# f_ann_date is the actual disclosure/re-disclosure date.  Use the later valid
# announcement date so a corrected filing cannot become visible on the date of
# the original filing.
calendar_date_expr: greatest(coalesce(nullIf(src.ann_date, toDate32('1970-01-01')), src.end_date), coalesce(nullIf(src.f_ann_date, toDate32('1970-01-01')), nullIf(src.ann_date, toDate32('1970-01-01')), src.end_date))
available_trade_date_expr: coalesce(calendar_map.next_trade_date, greatest(coalesce(nullIf(src.ann_date, toDate32('1970-01-01')), src.end_date), coalesce(nullIf(src.f_ann_date, toDate32('1970-01-01')), nullIf(src.ann_date, toDate32('1970-01-01')), src.end_date)), src.end_date)
partition_key:
  - toYear(available_trade_date)
indexes:
  - name: dwd_stock_income_idx
    columns:
      - instrument_id
      - event_date
      - sys_from
